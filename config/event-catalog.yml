# agentic-primitive: {"id":"event-catalog","kind":"workflow","enforcement":"deterministic","adrs":["ADR-0017","ADR-0018"],"domains":["agentic-delivery-governance","agentic-delivery-control-plane"]}
schemaVersion: 1
version: 1.0.0
organization: agentic-delivery-lab

# This is the organization event contract. The GitHub App manifest and the
# participant registry are validated projections of this catalog; neither is
# allowed to introduce an unreviewed event or action.
events:
  issues:
    role: lifecycle-input
    actions: [opened, edited, reopened, typed, untyped, labeled, unlabeled, closed]
  issue_comment:
    role: invocation-input
    actions: [created, edited]
  pull_request:
    role: observation-input
    actions: [opened, edited, synchronize, reopened, ready_for_review, closed]
  pull_request_review:
    role: invocation-input
    actions: [submitted, edited]
  pull_request_review_comment:
    role: invocation-input
    actions: [created, edited]

rules:
  issueLifecycleEventsMayRouteWithoutMention: true
  conversationEventsRequireExplicitInvocation: true
  pullRequestEventsAreObservationOnlyByDefault: true
  unsupportedEventsAreAcknowledgedWithoutRoute: true
  installationRepositoryEvents: not-enabled
