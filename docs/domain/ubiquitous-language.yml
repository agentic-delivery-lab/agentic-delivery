version: 1
domain:
  name: "Agentic delivery"
  purpose: "Govern how people and coding agents propose, implement, review, and record repository changes together."
bounded_contexts:
  - id: "agentic-delivery-governance"
    name: "Agentic delivery governance"
    definition: "The repository rules and agentic primitives used to propose, review, validate, and record delivery work."
  - id: "agentic-delivery-control-plane"
    name: "Agentic delivery control plane"
    definition: "The organization-aware delivery controller that receives signed GitHub events, validates participation and contracts, routes eligible work, orchestrates bounded execution, and performs authorized write-back without owning the durable work-state record."
terms:
  - context: "agentic-delivery-governance"
    term: "implementation plan"
    definition: "A clarified source issue outcome, constraints, verification approach, and ordered tasks that guide implementation."
  - context: "agentic-delivery-governance"
    term: "delivery run"
    definition: "One bounded execution of source issue intake, planning, implementation, validation, or review pull-request publication."
  - context: "agentic-delivery-governance"
    term: "budget boundary"
    definition: "The enforced condition that stops model execution before the configured subscription usage threshold or when quota telemetry is unavailable."
  - context: "agentic-delivery-governance"
    term: "continuation prompt"
    definition: "Saved instructions identifying a paused delivery run's source issue, phase, progress, remaining tasks, and conditions for resuming."
  - context: "agentic-delivery-governance"
    term: "continuation state"
    definition: "The persisted state of a delivery run that records its phase, execution status, exact Codex session correlation, waiting boundary, and consumed continuation events."
  - context: "agentic-delivery-governance"
    term: "awaiting-human"
    definition: "An intentional continuation state in which a delivery run waits for a trusted repository-writer comment and the Actions job exits successfully."
  - context: "agentic-delivery-governance"
    term: "Codex session"
    definition: "A persistent Codex app-server thread identified by a canonical UUID and correlated to one source issue's delivery run."
  - context: "agentic-delivery-governance"
    term: "waiting comment boundary"
    definition: "The persisted issue-comment ID after which a trusted repository-writer comment is eligible to continue an awaiting-human delivery run."
  - context: "agentic-delivery-governance"
    term: "conversation event"
    definition: "A GitHub issue or pull-request comment or review event that carries an attributable actor, immutable conversation ID, and body into the delivery control plane."
  - context: "agentic-delivery-governance"
    term: "invocation boundary"
    definition: "The deterministic activation condition consisting of a registered mention, supported conversation event, authorized actor, and valid source context before a delivery run may start or continue."
  - context: "agentic-delivery-governance"
    term: "agent invocation"
    definition: "A conversation event that passes the invocation boundary and requests a delivery run or continuation; it is an activation signal, not a semantic route."
  - context: "agentic-delivery-governance"
    term: "automation actor"
    definition: "A GitHub App, bot account, or managed coding agent that publishes attributable events; its identity does not by itself authorize a delivery run."
  - context: "agentic-delivery-governance"
    term: "actor catalog"
    definition: "The versioned deterministic allowlist of activation identities, supported conversation events, capabilities, and bounded automation handoff rules."
  - context: "agentic-delivery-governance"
    term: "bounded context"
    definition: "An explicit boundary within which one domain model and its terms have a defined meaning."
  - context: "agentic-delivery-governance"
    term: "ubiquitous language"
    definition: "The shared language built around a domain model and used consistently in communication, documentation, agent instructions, and domain-bearing code within a bounded context."
  - context: "agentic-delivery-governance"
    term: "domain model"
    definition: "The selected concepts, meanings, and relationships used to reason about agentic delivery in a bounded context."
  - context: "agentic-delivery-governance"
    term: "source issue"
    definition: "The GitHub Issue that provides the assignment brief and audit trail for a change; it may also serve as the ADR tracking issue."
    avoid:
      - "source ticket"
  - context: "agentic-delivery-governance"
    term: "ADR tracking issue"
    definition: "The source issue or linked sub-issue that specifically tracks an architecture decision record change and is linked from its review pull request."
    avoid:
      - "ADR ticket"
  - context: "agentic-delivery-governance"
    term: "architecture decision record"
    definition: "A versioned Markdown record that explains a significant architectural choice, its reasons, alternatives, and consequences."
    avoid:
      - "architecture decision document"
  - context: "agentic-delivery-governance"
    term: "provisional decision"
    definition: "An architecture decision record addition, change, or removal that exists only on a feature branch and is not yet official repository context."
    avoid:
      - "accepted decision"
  - context: "agentic-delivery-governance"
    term: "official decision"
    definition: "An architecture decision record that is present on the main branch and therefore belongs to the repository's official context."
    avoid:
      - "accepted ADR"
  - context: "agentic-delivery-governance"
    term: "review pull request"
    definition: "The pull request that contains a provisional decision and related changes for checks and human review before merge."
    avoid:
      - "acceptance pull request"
  - context: "agentic-delivery-governance"
    term: "agentic primitive"
    definition: "A versioned repository artifact, such as AGENTS.md or a skill, that gives coding agents reusable context or behavior."
  - context: "agentic-delivery-governance"
    term: "skill"
    definition: "An agentic primitive whose SKILL.md provides reusable task guidance and whose optional metadata controls discovery and presentation."
    avoid:
      - "prompt pack"
  - context: "agentic-delivery-governance"
    term: "plain language"
    definition: "Communication designed so its intended readers can get what they need, find it, understand it, and use it."
    avoid:
      - "simplified language"
  - context: "agentic-delivery-governance"
    term: "main branch"
    definition: "The repository's protected integration branch and official source of truth after approved changes are merged."
  - context: "agentic-delivery-governance"
    term: "trunk"
    definition: "The continuously integrated main line of development; in this repository it is the main branch."
  - context: "agentic-delivery-governance"
    term: "short-lived feature branch"
    definition: "A branch created from main for one change and kept for no more than two calendar days before its review pull request is completed or abandoned."
  - context: "agentic-delivery-governance"
    term: "issue-linked branch name"
    definition: "The canonical name of a short-lived feature branch that carries a change type, source issue number and lowercase summary."
  - context: "agentic-delivery-governance"
    term: "conventional commit"
    definition: "A commit whose message starts with a Conventional Commits type, optional scope and breaking marker followed by a colon and description."
  - context: "agentic-delivery-governance"
    term: "gitmoji"
    definition: "An official Gitmoji Unicode character or shortcode placed after the Conventional Commit prefix to signal the change's intention."
  - context: "agentic-delivery-governance"
    term: "changelog"
    definition: "A curated, human-readable record of notable repository changes grouped by impact and release state."
  - context: "agentic-delivery-governance"
    term: "unreleased section"
    definition: "The top changelog section that records reviewed changes not yet assigned to a released version."
  - context: "agentic-delivery-governance"
    term: "merge commit"
    definition: "A commit with more than one parent that records the integration of a review pull request into main."
  - context: "agentic-delivery-governance"
    term: "release"
    definition: "A human-authorized, immutable version of repository contents identified by a SemVer value and a Git tag."
  - context: "agentic-delivery-governance"
    term: "Semantic Versioning"
    definition: "The MAJOR.MINOR.PATCH versioning scheme where each component communicates compatibility impact."
  - context: "agentic-delivery-governance"
    term: "work type"
    definition: "A compatibility term for the native issue type that identifies what kind of work a source issue represents; current values include Idea, Research, Feature / Outcome, Bug, Task, Requirements, Architecture Decision, Implementation, and Validation."
    avoid:
      - "type label"
  - context: "agentic-delivery-governance"
    term: "lifecycle state"
    definition: "A historical compatibility term for the current lifecycle stage; authoritative lifecycle position is stored in the pinned Lifecycle Stage issue field."
    avoid:
      - "state label"
  - context: "agentic-delivery-governance"
    term: "issue type"
    definition: "The durable organization-level classification assigned to a GitHub Issue, distinct from its lifecycle stage, readiness, governance metadata, and runner execution state."
  - context: "agentic-delivery-governance"
    term: "lifecycle stage"
    definition: "The authoritative position of an issue in its work lifecycle, stored in the organization-level pinned Lifecycle Stage single-select field."
  - context: "agentic-delivery-governance"
    term: "issue field"
    definition: "Structured GitHub metadata attached to an issue and governed by an organization-level field definition."
  - context: "agentic-delivery-governance"
    term: "pinned issue field"
    definition: "An organization-level issue field configured to appear for the relevant issue types, including the universal Lifecycle Stage and Delivery Readiness fields."
  - context: "agentic-delivery-governance"
    term: "delivery readiness"
    definition: "The legacy name for the orthogonal Delivery State issue-field value during the compatibility migration. Current values describe whether the next authorized operation needs information, is ready, is working, is waiting, awaits a human, or is blocked. It is not a lifecycle stage or execution record."
    avoid:
      - "second lifecycle"
  - context: "agentic-delivery-governance"
    term: "delivery state"
    definition: "The canonical orthogonal organization issue-field dimension that authorizes or holds the next delivery operation independently of Lifecycle Stage, native Issue Type, governance metadata, and runner execution state. Delivery Readiness is its legacy field name during migration."
  - context: "agentic-delivery-governance"
    term: "governance metadata"
    definition: "Cross-cutting labels or equivalent metadata that record controls, constraints, required reviews, architecture decision work, or resolution separately from issue type, lifecycle stage, delivery readiness, and execution state."
  - context: "agentic-delivery-governance"
    term: "classification"
    definition: "The semantic interpretation of an eligible source issue and its conversation that proposes an issue type, lifecycle stage, delivery readiness, governance metadata, and next orchestration pattern for deterministic validation."
  - context: "agentic-delivery-governance"
    term: "lifecycle routing"
    definition: "The model-reasoned choice of the next maturation, discovery, requirements, decision, planning, implementation, validation, coordination, or final-disposition path, applied only after deterministic validation."
  - context: "agentic-delivery-governance"
    term: "routing proposal"
    definition: "An untrusted structured model result containing the proposed route, issue type, lifecycle stage, delivery readiness, governance labels, orchestration pattern, reason, and optional human message for one eligible issue event."
  - context: "agentic-delivery-governance"
    term: "label catalog"
    definition: "The versioned allowlist of governance labels and legacy migration mappings; it is not the authoritative catalog for issue types or lifecycle stages."
  - context: "agentic-delivery-governance"
    term: "readiness gate"
    definition: "A deterministic check that permits a proposed next operation only when issue type, required information, lifecycle stage, delivery readiness, decision gates, governance controls, dependencies, and policy requirements are satisfied."
  - context: "agentic-delivery-governance"
    term: "orchestration policy"
    definition: "The versioned deterministic catalog that maps structured issue, lifecycle, trigger, lineage, plan, session, execution, capability, and MCP context to an allowed orchestration pattern."
  - context: "agentic-delivery-governance"
    term: "orchestration pattern"
    definition: "A named, composable sequence of approved agent profiles and deterministic operations for one issue context; it is not a universal delivery chain."
  - context: "agentic-delivery-governance"
    term: "agent profile"
    definition: "A preconfigured role with an approved model, reasoning effort, mode, permissions, skills, capabilities, and repository mutation boundary."
  - context: "agentic-delivery-governance"
    term: "capability profile"
    definition: "The explicit set of repository, research, validation, network, tool, and MCP capabilities that an orchestration pattern or agent profile may use."
  - context: "agentic-delivery-governance"
    term: "research capability"
    definition: "An explicitly approved external-evidence capability bound to research work; it is never implicit in an implementation profile."
  - context: "agentic-delivery-governance"
    term: "plan validity"
    definition: "The deterministic result that a saved plan exists, its digest still matches the recorded plan, and no material scope change invalidates it."
  - context: "agentic-delivery-governance"
    term: "execution continuation"
    definition: "A delivery operation that resumes the exact saved Codex session for an unchanged valid plan without invoking planning again."
  - context: "agentic-delivery-governance"
    term: "architecture conformance review"
    definition: "A review of a proposed repository change against official and provisional architecture decisions, bounded-context language, deterministic controls, and available execution evidence."
  - context: "agentic-delivery-governance"
    term: "evidence contract"
    definition: "A stable machine-readable set of references that connects a delivery run or review pull request to its source issue, revision, Codex session, architecture context, validation, and available runtime evidence."
  - context: "agentic-delivery-governance"
    term: "control plane"
    definition: "The GitHub Issues, pull requests, lifecycle metadata, and deterministic Actions that own delivery intent and work state."
  - context: "agentic-delivery-governance"
    term: "execution plane"
    definition: "The Codex CLI and self-hosted runner processes that perform bounded work requested by the control plane."
  - context: "agentic-delivery-governance"
    term: "work state"
    definition: "The authoritative issue type, lifecycle stage, delivery readiness, and governance metadata stored in GitHub and changed only by allowed deterministic operations."
  - context: "agentic-delivery-governance"
    term: "execution state"
    definition: "The persisted condition of one delivery run, including its operation, run identity, failure evidence, and recoverability."
  - context: "agentic-delivery-governance"
    term: "refinement"
    definition: "The conditional intake activity that turns an initial source issue into a clear goal, requirements, constraints, acceptance criteria, and unresolved decisions."
  - context: "agentic-delivery-governance"
    term: "refined goal"
    definition: "The accepted outcome of refinement recorded in the parent source issue before an implementation plan exists."
  - context: "agentic-delivery-governance"
    term: "decomposition"
    definition: "The conditional breakdown of a refined goal into only the research, specification, decision, implementation, validation, or task work items needed to proceed."
  - context: "agentic-delivery-governance"
    term: "lineage root"
    definition: "The parent source issue that preserves the history from initial intake through child work, decisions, implementation, validation, and acceptance."
  - context: "agentic-delivery-governance"
    term: "transition proposal"
    definition: "An untrusted lifecycle-stage and readiness result proposed by Codex or another event before deterministic validation."
  - context: "agentic-delivery-governance"
    term: "lifecycle transition"
    definition: "An allowed change from one Lifecycle Stage field value to another, validated against the issue type, governance controls, dependencies, and configured transition table."
  - context: "agentic-delivery-governance"
    term: "transition validator"
    definition: "A deterministic rule engine that accepts or rejects a proposed work-state change before GitHub metadata is mutated."
  - context: "agentic-delivery-governance"
    term: "primitive reference"
    definition: "Machine-readable metadata embedded in an agentic primitive that names the governing ADRs and applicable bounded contexts."
  - context: "agentic-delivery-governance"
    term: "active ADR"
    definition: "An architecture decision record present in the repository revision being evaluated; records on main are official and branch-only records are provisional."
  - context: "agentic-delivery-governance"
    term: "traceability index"
    definition: "Generated machine-readable data that links active ADRs and domains to implementing primitives and provides the reverse lookup."
  - context: "agentic-delivery-control-plane"
    term: "delivery controller"
    definition: "The versioned executable implementation that receives eligible GitHub events, applies semantic routing followed by deterministic authorization, orchestrates bounded work, and performs controlled write-back to the originating repository."
  - context: "agentic-delivery-control-plane"
    term: "participating repository"
    definition: "An organization repository that is explicitly enrolled for Agentic Delivery through both App installation access and an active or shadow entry in the central participant registry."
  - context: "agentic-delivery-control-plane"
    term: "enrollment"
    definition: "The reviewed change that places a repository ID, expected name, controller pin, contract versions, operating mode, and local integration profile in the central participant registry after App access is available."
  - context: "agentic-delivery-control-plane"
    term: "participant registry"
    definition: "The versioned Control Plane catalog that records which repository IDs may receive Agentic Delivery processing, which controller and contract versions they use, and whether processing is disabled, shadow, or active."
  - context: "agentic-delivery-control-plane"
    term: "event envelope"
    definition: "A signed, versioned record carrying GitHub delivery identity, organization and installation identity, originating repository identity, event object identity, actor data, payload digest, and dispatch hop for central processing."
  - context: "agentic-delivery-control-plane"
    term: "controller pin"
    definition: "The immutable Git commit recorded for a participating repository so that its delivery behavior cannot change silently when the Control Plane advances."
  - context: "agentic-delivery-control-plane"
    term: "contract version"
    definition: "A declared compatible version of an event, lifecycle, state-machine, evidence, bootstrap, primitive, or architecture interface used by a delivery controller and participant."
  - context: "agentic-delivery-control-plane"
    term: "shadow mode"
    definition: "A participant operating a pinned controller that may receive and evaluate events and publish evidence, but cannot perform lifecycle or repository mutations."
  - context: "agentic-delivery-control-plane"
    term: "controller release"
    definition: "A named Delivery Control Plane version paired with an immutable source commit, supported contract versions, compatible Architecture and Primitive ranges, and a minimum bootstrap version."
  - context: "agentic-delivery-control-plane"
    term: "state-machine version"
    definition: "The explicit version of the lifecycle transition contract used to validate a delivery proposal; it is persisted with execution state and is not inferred from a mutable branch."
