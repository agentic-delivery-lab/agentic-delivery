version: 2

# ADR relationships are derived from primitive references into
# docs/architecture/adr-primitive-index.json. This file maps only runtime
# surfaces and bounded-context paths used to select review evidence.

bounded-contexts:
  - id: agentic-delivery-governance
    register: docs/domain/ubiquitous-language.yml
    paths: [AGENTS.md, .agents/**, .github/**, docs/**, scripts/**, tests/**, package.json, pnpm-workspace.yaml]
  - id: agentic-delivery-control-plane
    register: docs/domain/ubiquitous-language.yml
    paths: [api/github/**, config/participants.yml, .github/workflows/agent-invocation.yml, .github/workflows/agent-observation.yml, .github/workflows/issue-intake.yml, .github/workflows/codex-delivery.yml, .github/workflows/harness-architecture-review.yml, scripts/codex-delivery.mjs, scripts/issue-intake.mjs, scripts/prepare-agent-invocation.mjs, scripts/normalize-repository-dispatch-event.mjs, scripts/harness-architecture-review.mjs, scripts/lib/github-app.mjs, scripts/lib/participant-registry.mjs, scripts/lib/issue-field-api.mjs, scripts/lib/codex-client.mjs, scripts/lib/codex-loop.mjs, scripts/lib/quota-diagnostics.mjs, scripts/lib/architecture-review.mjs, scripts/lib/architecture-review-agent.mjs, docs/architecture/quota-diagnostics.schema.json, docs/domain/ubiquitous-language.yml]

runtime-surfaces:
  - id: intake-and-routing
    paths: [.github/workflows/issue-intake.yml, scripts/issue-intake.mjs, scripts/lib/issue-routing.mjs, scripts/lib/issue-field-api.mjs]
    evidence: [source-issue, issue-type, lifecycle-stage, delivery-readiness, governance-metadata, tests]
  - id: codex-delivery
    paths: [.github/workflows/codex-delivery.yml, scripts/codex-delivery.mjs, scripts/lib/codex-client.mjs, scripts/lib/codex-loop.mjs, scripts/lib/quota-diagnostics.mjs, scripts/lib/issue-field-api.mjs]
    evidence: [source-issue, issue-type, lifecycle-stage, actions-run, codex-session, validation, review-pull-request]
  - id: architecture-review
    paths: [.github/workflows/harness-architecture-review.yml, .github/workflows/delivery-quality.yml, .github/workflows/adr-quality.yml, scripts/classify-codex-cli-updater-review.mjs, scripts/harness-architecture-review.mjs, scripts/lib/architecture-review.mjs, scripts/lib/architecture-review-agent.mjs, scripts/lib/codex-client.mjs, scripts/lib/codex-loop.mjs, scripts/lib/github-native-issue-type.mjs, scripts/lib/pull-request-check-readiness.mjs, scripts/lib/quota-diagnostics.mjs, docs/architecture/quota-diagnostics.schema.json]
    evidence: [base-revision, head-revision, workflow-provenance, affected-adrs, affected-contexts, pull-request-body, head-check-runs, deterministic-result, semantic-result, pinned-decision-records, architecture-review-session, semantic-review-fingerprint, quota-diagnostics]
  - id: codex-cli-maintenance
    paths: [.github/workflows/codex-cli-release-update.yml, .github/workflows/self-hosted-runner-smoke.yml, scripts/classify-codex-cli-updater-review.mjs, scripts/codex-cli-release-update.mjs, scripts/lib/github-native-issue-type.mjs, scripts/lib/pull-request-check-readiness.mjs, scripts/setup-runner-codex.mjs, scripts/codex-preflight.mjs]
    evidence: [candidate-version, release-asset-digest, source-issue, native-task-type, exact-head-checks, workflow-provenance, runner-preflight, semantic-review]
  - id: agent-invocation
    paths: [config/agent-actors.json, config/issue-metadata.yml, config/orchestration-policy.yml, .github/workflows/agent-invocation.yml, .github/workflows/issue-intake.yml, api/github/**, scripts/lib/agent-invocation.mjs, scripts/prepare-agent-invocation.mjs, scripts/authorize-issue-event.mjs]
    evidence: [conversation-event, invocation-boundary, actor-catalog, actor-authorization, delivery-dispatch, idempotency, hop-limit, actions-run]
