version: 2

# ADR relationships are derived from primitive references into
# docs/architecture/adr-primitive-index.json. This file maps only runtime
# surfaces and bounded-context paths used to select review evidence.

bounded-contexts:
  - id: agentic-delivery-governance
    register: docs/domain/ubiquitous-language.yml
    paths: [AGENTS.md, .agents/**, .github/**, docs/**, scripts/**, tests/**, package.json, pnpm-workspace.yaml]
  - id: agentic-delivery-control-plane
    register: docs/domain/ubiquitous-language.yml
    paths: [api/github/**, .github/participants.yml, .github/workflows/agent-invocation.yml, .github/workflows/issue-intake.yml, .github/workflows/codex-delivery.yml, scripts/codex-delivery.mjs, scripts/issue-intake.mjs, scripts/prepare-agent-invocation.mjs, scripts/lib/github-app.mjs, scripts/lib/participant-registry.mjs]

runtime-surfaces:
  - id: intake-and-routing
    paths: [.github/workflows/issue-intake.yml, scripts/issue-intake.mjs, scripts/lib/issue-routing.mjs]
    evidence: [source-issue, issue-type, lifecycle-stage, delivery-readiness, governance-metadata, tests]
  - id: codex-delivery
    paths: [.github/workflows/codex-delivery.yml, scripts/codex-delivery.mjs, scripts/lib/codex-client.mjs, scripts/lib/codex-loop.mjs]
    evidence: [source-issue, issue-type, lifecycle-stage, actions-run, codex-session, validation, review-pull-request]
  - id: architecture-review
    paths: [.github/workflows/harness-architecture-review.yml, scripts/harness-architecture-review.mjs, scripts/lib/architecture-review.mjs]
    evidence: [base-revision, head-revision, affected-adrs, affected-contexts, deterministic-result, semantic-result]
  - id: agent-invocation
    paths: [.github/agent-actors.json, .github/orchestration-policy.yml, .github/workflows/agent-invocation.yml, .github/workflows/issue-intake.yml, api/github/**, scripts/lib/agent-invocation.mjs, scripts/prepare-agent-invocation.mjs, scripts/authorize-issue-event.mjs]
    evidence: [conversation-event, invocation-boundary, actor-catalog, actor-authorization, delivery-dispatch, idempotency, hop-limit, actions-run]
