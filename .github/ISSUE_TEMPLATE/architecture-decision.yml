name: Architecture decision
description: Start a traceable investigation for an ADR or ADR removal.
type: Architecture Decision
title: "ADR: "
labels:
  - "adr:needed"
body:
  - type: markdown
    attributes:
      value: |
        Use this form when a new, changed or removed architectural decision needs a traceable record.
        A normal source issue may remain the assignment brief and serve as the ADR tracking issue. During triage, refining or implementation, an agent may create this form as a linked sub-issue when separate ADR tracking is useful.

        Do not include passwords, API keys, personal data or other secrets.

  - type: textarea
    id: context
    attributes:
      label: Context and problem
      description: What is changing, what problem must be solved and why is a decision needed now?
      placeholder: Describe the current situation and the decision question.
    validations:
      required: true

  - type: dropdown
    id: operation
    attributes:
      label: ADR operation
      description: What kind of ADR change is being considered?
      options:
        - Create or update an ADR
        - Remove an existing ADR
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope and affected areas
      description: Which components, teams, interfaces, data or operational concerns could this affect?
      placeholder: List the systems, modules, teams, users or workflows in scope.
    validations:
      required: true

  - type: textarea
    id: domain_language
    attributes:
      label: Affected bounded contexts and domain terms
      description: List each affected bounded-context ID and registered term. Explain terms that are new, conflicting or changing, or write "None" when the domain model is not affected.
      placeholder: |
        - agentic-delivery-governance: source issue, review pull request
        or: None
    validations:
      required: true

  - type: textarea
    id: drivers
    attributes:
      label: Decision drivers and constraints
      description: Which qualities, constraints, deadlines or non-negotiable requirements should guide the choice?
      placeholder: Include security, privacy, reliability, performance, cost, compatibility or compliance needs when relevant.
    validations:
      required: true

  - type: textarea
    id: options
    attributes:
      label: Known options
      description: Which workable approaches are known? Add a short trade-off for each when possible.
      placeholder: |
        - Option A — benefits and drawbacks
        - Option B — benefits and drawbacks
    validations:
      required: true

  - type: dropdown
    id: significance
    attributes:
      label: Why might this need an ADR?
      description: Select every signal that applies. The final decision remains subject to review.
      multiple: true
      options:
        - Costly or risky to reverse
        - Affects multiple components, teams or future changes
        - Establishes a public interface, data model or ownership boundary
        - Changes security, privacy, availability, performance or deployment posture
        - Introduces or changes a repository-wide standard or important dependency
        - Rationale is likely to be revisited and needs durable traceability
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Reversibility and impact
      description: How hard would it be to undo this choice, and what would a wrong choice cost?
      placeholder: Describe migration, compatibility, operational or user impact.
    validations:
      required: true

  - type: textarea
    id: owner_timeline
    attributes:
      label: Decision owner and desired date
      description: Who owns or coordinates the decision, and when is it needed?
      placeholder: Give a name or GitHub handle and a date, or explain why there is no fixed date.
    validations:
      required: true

  - type: textarea
    id: related_links
    attributes:
      label: Related work and evidence
      description: Link related issues, pull requests, experiments, documents or measurements.
      placeholder: Add one link per line, or write "None yet".
    validations:
      required: true

  - type: textarea
    id: affected_adrs
    attributes:
      label: Affected ADR files
      description: List existing ADR paths for a removal or update. For a new decision, write "None yet".
      placeholder: |
        docs/decisions/0001-example.md
        or: None yet
    validations:
      required: true

  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Submission checks
      options:
        - label: I have not included secrets or unnecessary personal data.
          required: true
        - label: I understand that an ADR change is provisional on its feature branch and official only after an approved pull request is merged into `main`.
          required: true
