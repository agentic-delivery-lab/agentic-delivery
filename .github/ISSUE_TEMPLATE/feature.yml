name: Feature / Request
description: Describe a user problem and the outcome a change should achieve.
type: Feature
title: "Feature: "
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem and desired outcome. Architectural impact is assessed during refinement.
        Do not include passwords, API keys, personal data, or other secrets.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem needs to be solved?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should be different when this work succeeds?
    validations:
      required: true
  - type: input
    id: beneficiary
    attributes:
      label: Beneficiary or user
      description: Who benefits from the outcome?
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current behavior
      description: What happens today?
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: List compatibility, security, performance, timing, or other constraints.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance signals
      description: How will people know that the desired outcome was reached?
    validations:
      required: true
  - type: textarea
    id: architecture
    attributes:
      label: Known architectural impact
      description: Describe known impact, or write "None known" for triage to assess.
    validations:
      required: true
