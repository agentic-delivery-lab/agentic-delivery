# agentic-primitive: {"id":"lifecycle-transition-rules","kind":"state-machine","enforcement":"deterministic","adrs":["ADR-0012"],"domains":["agentic-delivery-governance"]}
version: 2

types:
  - id: bug
    name: Bug
    label: "type:bug"
    initial_state: needs-triage
    delivery: true
  - id: feature
    name: Feature
    label: "type:feature"
    initial_state: requirements
    delivery: true
  - id: task
    name: Task
    label: "type:task"
    initial_state: needs-triage
    delivery: true
  - id: idea
    name: Idea
    label: "type:idea"
    initial_state: needs-triage
    delivery: false
  - id: research
    name: Research
    label: "type:research"
    initial_state: investigating
    delivery: false
  - id: architecture
    name: Architecture
    label: "type:architecture"
    initial_state: decision-needed
    delivery: true
  - id: specification
    name: Specification
    label: "type:specification"
    initial_state: requirements
    delivery: false
  - id: implementation
    name: Implementation
    label: "type:implementation"
    initial_state: ready-for-plan
    delivery: true
  - id: validation
    name: Validation
    label: "type:validation"
    initial_state: ready-for-plan
    delivery: true

states:
  - id: needs-triage
    label: "state:needs-triage"
    color: "D4C5F9"
    description: "Work type or next lifecycle step needs triage."
  - id: needs-info
    label: "state:needs-info"
    color: "FBCA04"
    description: "Required information is missing."
  - id: requirements
    label: "state:requirements"
    color: "FBCA04"
    description: "The desired outcome and acceptance conditions need refinement."
  - id: decomposing
    label: "state:decomposing"
    color: "FBCA04"
    description: "A refined goal is being conditionally split into work items."
  - id: decision-needed
    label: "state:decision-needed"
    color: "B60205"
    description: "An architectural or governance decision is outstanding."
  - id: investigating
    label: "state:investigating"
    color: "1D76DB"
    description: "Research is collecting evidence and findings."
  - id: parked
    label: "state:parked"
    color: "C5DEF5"
    description: "An idea is deliberately deferred."
  - id: ready-for-plan
    label: "state:ready-for-plan"
    color: "0E8A16"
    description: "The deterministic readiness contract authorizes planning."
  - id: ready-for-agent
    label: "state:ready-for-agent"
    color: "0E8A16"
    description: "A completed plan authorizes implementation."
  - id: in-progress
    label: "state:in-progress"
    color: "1D76DB"
    description: "Authorized implementation is in progress."
  - id: review
    label: "state:review"
    color: "5319E7"
    description: "A review pull request is ready for human review."
  - id: coordinating
    label: "state:coordinating"
    color: "1D76DB"
    description: "A lineage root is waiting for or integrating child work."
  - id: acceptance
    label: "state:acceptance"
    color: "5319E7"
    description: "Required implementation and validation are complete and human acceptance is pending."
  - id: done
    label: "state:done"
    color: "6E7781"
    description: "The work has reached its final disposition."

governance:
  - label: "adr:needed"
    color: "B60205"
    description: "Triage found an architecture decision record is needed."
  - label: "adr:proposed"
    color: "B60205"
    description: "An architecture decision record is active on a branch or pull request."
  - label: "adr:removal"
    color: "B60205"
    description: "The active architecture decision change removes a record."
  - label: "adr:rejected"
    color: "6E7781"
    description: "The proposed architecture decision was rejected."
  - label: "human-review"
    color: "5319E7"
    description: "A human review control applies to this work."
  - label: "security-review"
    color: "B60205"
    description: "A security review control applies to this work."

transitions:
  needs-triage: [needs-info, requirements, decision-needed, investigating, decomposing, ready-for-plan, done]
  needs-info: [needs-triage, requirements, decision-needed, investigating, decomposing, parked, ready-for-plan, ready-for-agent, in-progress, done]
  requirements: [needs-triage, needs-info, decision-needed, investigating, decomposing, ready-for-plan, parked, done]
  decision-needed: [needs-triage, needs-info, requirements, investigating, decomposing, ready-for-plan, done]
  investigating: [needs-triage, needs-info, requirements, decision-needed, decomposing, ready-for-plan, parked, done]
  decomposing: [needs-triage, needs-info, requirements, coordinating, ready-for-plan, done]
  parked: [needs-triage, requirements, investigating, done]
  ready-for-plan: [needs-triage, needs-info, ready-for-agent, in-progress, coordinating, done]
  ready-for-agent: [needs-triage, needs-info, in-progress, done]
  in-progress: [needs-triage, needs-info, ready-for-plan, review, coordinating, done]
  review: [needs-triage, in-progress, acceptance, coordinating, done]
  coordinating: [needs-triage, requirements, decomposing, ready-for-plan, acceptance, done]
  acceptance: [needs-triage, coordinating, done]
  done: [needs-triage, requirements, investigating, decision-needed, parked]

readiness:
  delivery_types: [bug, feature, task, architecture, implementation, validation]
  blocking_governance: ["adr:needed", "adr:proposed", "adr:removal"]

forms:
  bug:
    headings: ["Observed behavior", "Expected behavior", "Reproduction steps"]
    required: ["Observed behavior", "Expected behavior", "Reproduction steps", "Environment", "Evidence or logs", "Impact"]
  feature:
    headings: ["Problem", "Desired outcome", "Beneficiary or user"]
    required: ["Problem", "Desired outcome", "Beneficiary or user", "Current behavior", "Constraints", "Acceptance signals", "Known architectural impact"]
  idea:
    headings: ["Idea or opportunity", "Problem being addressed", "Expected value"]
    required: ["Idea or opportunity", "Problem being addressed", "Expected value", "Assumptions", "Unknowns", "Supporting context"]
  task:
    headings: ["Requested outcome", "Scope", "Definition of done"]
    required: ["Requested outcome", "Scope", "Constraints", "Definition of done", "Relevant references"]
