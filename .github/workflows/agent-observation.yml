name: agent-observation

# Pull-request lifecycle observations are deliberately separated from the
# agent-invocation workflow. This path validates identity and enrollment only;
# it does not receive App credentials, mutate GitHub state, or start Codex.
on:
  repository_dispatch:
    types: [agent_observation]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the workflow revision for dispatch normalization
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          path: dispatch-boundary
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          runtime: node@24
          install: false
          package-json-file: dispatch-boundary/package.json

      - name: Install trusted observation validator dependencies
        run: pnpm --dir dispatch-boundary install --frozen-lockfile --ignore-scripts

      - name: Normalize the wrapped event for the pinned controller reader
        id: normalized-event
        env:
          SOURCE_EVENT_PATH: ${{ github.event_path }}
          NORMALIZED_EVENT_PATH: ${{ runner.temp }}/agentic-delivery-event.json
        run: |
          node dispatch-boundary/scripts/normalize-repository-dispatch-event.mjs "$SOURCE_EVENT_PATH" "$NORMALIZED_EVENT_PATH"
          echo "event_path=$NORMALIZED_EVENT_PATH" >> "$GITHUB_OUTPUT"

      - name: Verify the signed event and registry pin before pinned checkout
        id: trusted-validation
        env:
          CONTROLLER_EVENT_PATH: ${{ steps.normalized-event.outputs.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CODEX_DELIVERY_DISPATCH_SECRET: ${{ secrets.CODEX_DELIVERY_DISPATCH_SECRET }}
        run: GITHUB_EVENT_PATH="$CONTROLLER_EVENT_PATH" node dispatch-boundary/scripts/validate-observation-event.mjs dispatch-boundary

      - name: Validate the trusted controller pin
        env:
          CONTROLLER_COMMIT: ${{ steps.trusted-validation.outputs.controller_commit }}
        run: |
          set -euo pipefail
          [[ "$CONTROLLER_COMMIT" =~ ^[0-9a-f]{40}$ ]]

      - name: Check out the validated pinned observation reader
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ steps.trusted-validation.outputs.controller_commit }}
          path: controller
          persist-credentials: false

      - name: Install pinned observation validator dependencies
        run: pnpm --dir controller install --frozen-lockfile --ignore-scripts

      - name: Recheck with the immutable pinned observation validator
        env:
          CONTROLLER_EVENT_PATH: ${{ steps.normalized-event.outputs.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CODEX_DELIVERY_DISPATCH_SECRET: ${{ secrets.CODEX_DELIVERY_DISPATCH_SECRET }}
        run: GITHUB_EVENT_PATH="$CONTROLLER_EVENT_PATH" node controller/scripts/validate-observation-event.mjs dispatch-boundary
