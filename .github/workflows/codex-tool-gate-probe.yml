name: codex-tool-gate-probe
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'runtime/codex/**'
      - 'scripts/prepare-codex-tool-gate.mjs'
      - 'scripts/probe-codex-tool-gate.mjs'
      - 'tests/delivery/codex-tool-gate-source.test.mjs'
      - '.github/workflows/codex-tool-gate-probe.yml'
permissions:
  contents: read
concurrency:
  group: native-tool-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  native-source-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: control-plane
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: openai/codex
          ref: 01fc69f4026735edfdf6789820549727a4867b11
          path: upstream
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # upstream-pinned Rust 1.95.0
        with:
          components: rustfmt, clippy, rust-src
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # upstream-pinned v2.62.49
        with:
          tool: just@1.51.0
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # upstream-pinned v2.62.49
        with:
          tool: cargo-nextest@0.9.103
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # upstream-pinned v2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.9.0'
          enable-cache: false
      - name: Prepare only the pinned clean source
        run: |
          mkdir -p tool-gate-evidence
          node control-plane/scripts/prepare-codex-tool-gate.mjs upstream > tool-gate-evidence/source-preparation.json
          rustc -vV > tool-gate-evidence/rustc.txt
          cargo --version > tool-gate-evidence/cargo.txt
      - name: Format before testing, following upstream instructions
        working-directory: upstream
        run: just fmt
      - name: Test the changed core crate
        working-directory: upstream
        run: just test --locked -p codex-core
      - name: Test the complete upstream workspace
        working-directory: upstream
        run: just test --locked
      - name: Build the actual CLI without installing it
        working-directory: upstream/codex-rs
        run: cargo build --locked --bin codex
      - name: Probe native startup without a model or credentials
        run: node control-plane/scripts/probe-codex-tool-gate.mjs upstream/codex-rs/target/debug/codex > tool-gate-evidence/native-bootstrap.json
      - name: Diagnose dependency resolution after a failed locked build
        if: failure()
        working-directory: upstream/codex-rs
        run: |
          # Diagnostic only: the failed locked build remains failed. Preserve
          # the exact proposed dependency delta before any future admission.
          cargo metadata --format-version=1 --all-features --filter-platform x86_64-unknown-linux-gnu > ../../tool-gate-evidence/dependency-resolution.json 2> ../../tool-gate-evidence/dependency-resolution.stderr || true
          git diff -- Cargo.lock > ../../tool-gate-evidence/dependency-lock-delta.patch
      - name: Record source and dependency provenance
        if: always()
        run: |
          mkdir -p tool-gate-evidence
          git -C upstream diff --binary > tool-gate-evidence/prepared-source.patch
          cp upstream/codex-rs/core/src/operation_tool_gate.rs tool-gate-evidence/operation_tool_gate.rs
          cp upstream/LICENSE tool-gate-evidence/LICENSE.upstream
          if test -f upstream/NOTICE; then cp upstream/NOTICE tool-gate-evidence/NOTICE.upstream; fi
          sha256sum upstream/codex-rs/Cargo.lock > tool-gate-evidence/cargo-lock.sha256
          if test -f upstream/codex-rs/target/debug/codex; then sha256sum upstream/codex-rs/target/debug/codex > tool-gate-evidence/cli.sha256; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: native-tool-gate-source-probe
          path: tool-gate-evidence
          retention-days: 7
          if-no-files-found: error
