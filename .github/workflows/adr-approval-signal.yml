name: adr-approval-signal

on:
  pull_request_review:
    types: [submitted]

# This workflow is deliberately unprivileged. Its successful run is only a
# signal for the trusted workflow_run workflow below; it never checks out PR
# code, reads secrets or writes repository contents.
permissions: {}

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REVIEW_STATE: ${{ github.event.review.state }}
      HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Signal an eligible approval
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$REVIEW_STATE" != 'approved' ]]; then
            printf 'Review state is %s; no acceptance signal emitted.\n' "$REVIEW_STATE"
            exit 1
          fi
          if [[ "$HEAD_REPOSITORY" != "$REPOSITORY" ]]; then
            printf 'Review is from %s; fork approvals are not accepted automatically.\n' "$HEAD_REPOSITORY"
            exit 1
          fi
          if [[ "$BASE_BRANCH" != "$DEFAULT_BRANCH" ]]; then
            printf 'Pull request targets %s rather than %s; no acceptance signal emitted.\n' "$BASE_BRANCH" "$DEFAULT_BRANCH"
            exit 1
          fi

          printf 'Eligible approval signal emitted for %s.\n' "$REPOSITORY"
