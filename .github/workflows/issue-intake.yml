name: issue-intake

on:
  issues:
    types: [opened, edited, reopened, typed, untyped, closed]
  workflow_call:
    inputs:
      agent_invocation:
        description: Run from a validated GitHub App mention envelope
        required: false
        default: false
        type: boolean
    secrets:
      CODEX_DELIVERY_APP_PRIVATE_KEY:
        required: true
      CODEX_DELIVERY_DISPATCH_SECRET:
        required: true
      ISSUE_FIELD_BINDINGS_JSON:
        required: true
  workflow_dispatch:
    inputs:
      issue:
        description: Open source issue number to classify or recover
        required: true
        type: string
      force:
        description: Break glass by using current approved metadata when semantic routing is unavailable
        required: false
        default: false
        type: boolean
      force_read_only:
        description: Keep this run read-only; the registered participant mode cannot be overridden
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  authorize:
    if: >-
      !github.event.issue.pull_request &&
      (github.event_name != 'repository_dispatch' || inputs.agent_invocation)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      authorized: ${{ steps.authorize.outputs.authorized }}
    steps:
      - name: Check out trusted authorization
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Bootstrap pin: config/controller-release.json bootstrapCommit.
          ref: e0b2f0719e00ac49aaab305ea10065c5f5197cb1
          path: trusted-intake
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          runtime: node@24
          install: false
          package-json-file: trusted-intake/package.json

      - name: Install trusted authorization dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: trusted-intake

      - name: Validate intake caller provenance
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          AGENT_INVOCATION: ${{ inputs.agent_invocation || false }}
          CURRENT_REPOSITORY: ${{ github.repository }}
          CURRENT_REPOSITORY_ID: ${{ github.event.repository.id }}
        run: node scripts/validate-intake-caller.mjs
        working-directory: trusted-intake

      - name: Authorize the issue event actor before self-hosted intake
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: node trusted-intake/scripts/authorize-issue-event.mjs

  classify:
    needs: authorize
    if: >-
      needs.authorize.result == 'success' &&
      needs.authorize.outputs.authorized == 'true' &&
      !github.event.issue.pull_request &&
      (github.event_name != 'repository_dispatch' || inputs.agent_invocation)
    runs-on: [self-hosted, linux, x64, omarchy]
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      issue: ${{ steps.intake.outputs.issue }}
      route: ${{ steps.intake.outputs.route }}
      state: ${{ steps.intake.outputs.state }}
      lifecycle_stage: ${{ steps.intake.outputs.lifecycle_stage }}
      readiness: ${{ steps.intake.outputs.readiness }}
      orchestration_pattern: ${{ steps.intake.outputs.orchestration_pattern }}
      invocation_accepted: ${{ steps.invocation.outputs.accepted || 'true' }}
      source_issue: ${{ steps.invocation.outputs.source_issue || steps.intake.outputs.issue }}
      origin_repository: ${{ steps.invocation.outputs.origin_repository || github.repository }}
      origin_repository_id: ${{ steps.invocation.outputs.origin_repository_id || github.event.repository.id }}
      participant_mode: ${{ steps.intake-policy.outputs.participant_mode }}
      read_only_run: ${{ steps.intake-policy.outputs.read_only_run }}
      controller_version: ${{ steps.invocation.outputs.controller_version || steps.participant.outputs.controller_version }}
      controller_commit: ${{ steps.invocation.outputs.controller_commit || steps.participant.outputs.controller_commit }}
      invocation_event_name: ${{ steps.invocation.outputs.invocation_event_name }}
      invocation_source_kind: ${{ steps.invocation.outputs.invocation_source_kind }}
      invocation_comment_id: ${{ steps.invocation.outputs.invocation_comment_id }}
      invocation_review_id: ${{ steps.invocation.outputs.invocation_review_id }}
      invocation_pull_request_number: ${{ steps.invocation.outputs.invocation_pull_request_number }}
      invocation_delivery_id: ${{ steps.invocation.outputs.invocation_delivery_id }}
      invocation_actor: ${{ steps.invocation.outputs.invocation_actor }}
      invocation_actor_kind: ${{ steps.invocation.outputs.invocation_actor_kind }}
      invocation_authorized: ${{ steps.invocation.outputs.invocation_authorized }}
      invocation_body_digest: ${{ steps.invocation.outputs.invocation_body_digest }}
    steps:
      - name: Check out trusted intake
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Bootstrap pin: config/controller-release.json bootstrapCommit.
          ref: e0b2f0719e00ac49aaab305ea10065c5f5197cb1
          path: trusted-intake
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          runtime: node@24
          install: false
          package-json-file: trusted-intake/package.json

      - name: Install intake dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: trusted-intake

      - name: Resolve participant mode for direct intake
        id: participant
        if: ${{ !inputs.agent_invocation }}
        env:
          ORIGIN_REPOSITORY: ${{ github.repository }}
          ORIGIN_REPOSITORY_ID: ${{ github.event.repository.id }}
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { loadParticipantRegistry, participantForRepository } from './scripts/lib/participant-registry.mjs';

          const registry = await loadParticipantRegistry();
          if (!registry.valid) throw new Error(`The participant registry is invalid: ${registry.errors.join(' ')}`);
          const participant = participantForRepository(registry, process.env.ORIGIN_REPOSITORY_ID);
          if (!participant) throw new Error('The event repository is not enrolled in the participant registry.');
          if (participant.expectedFullName !== process.env.ORIGIN_REPOSITORY) {
            throw new Error('The event repository name does not match the participant registry.');
          }
          if (participant.mode === 'disabled') throw new Error('The participant registry mode is disabled.');
          process.stdout.write(`participant_mode=${participant.mode}\n`);
          process.stdout.write(`controller_version=${participant.controller.version}\n`);
          process.stdout.write(`controller_commit=${participant.controller.commit}\n`);
          NODE
        working-directory: trusted-intake

      - name: Validate and normalize explicit agent invocation
        id: invocation
        if: ${{ inputs.agent_invocation }}
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_DELIVERY_APP_ID: ${{ vars.CODEX_DELIVERY_APP_ID }}
          CODEX_DELIVERY_APP_PRIVATE_KEY: ${{ secrets.CODEX_DELIVERY_APP_PRIVATE_KEY }}
          CODEX_DELIVERY_APP_INSTALLATION_ID: ${{ vars.CODEX_DELIVERY_APP_INSTALLATION_ID }}
          CODEX_DELIVERY_DISPATCH_SECRET: ${{ secrets.CODEX_DELIVERY_DISPATCH_SECRET }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CODEX_DELIVERY_STATE_DIR: ${{ vars.CODEX_DELIVERY_STATE_DIR }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: node scripts/prepare-agent-invocation.mjs
        working-directory: trusted-intake

      - name: Resolve participant and read-only run policy
        id: intake-policy
        if: ${{ !inputs.agent_invocation || steps.invocation.outputs.accepted == 'true' }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          AGENT_INVOCATION: ${{ inputs.agent_invocation || false }}
          REGISTRY_PARTICIPANT_MODE: ${{ steps.participant.outputs.participant_mode }}
          INVOCATION_PARTICIPANT_MODE: ${{ steps.invocation.outputs.participant_mode }}
          FORCE_READ_ONLY: ${{ inputs.force_read_only || false }}
        run: node scripts/lib/intake-policy.mjs
        working-directory: trusted-intake

      - name: Validate the selected controller commit
        if: ${{ !inputs.agent_invocation || steps.invocation.outputs.accepted == 'true' }}
        env:
          CONTROLLER_COMMIT: ${{ steps.invocation.outputs.controller_commit || steps.participant.outputs.controller_commit }}
        run: |
          set -euo pipefail
          [[ "$CONTROLLER_COMMIT" =~ ^[0-9a-f]{40}$ ]]

      - name: Check out the validated controller release
        if: ${{ !inputs.agent_invocation || steps.invocation.outputs.accepted == 'true' }}
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ steps.invocation.outputs.controller_commit || steps.participant.outputs.controller_commit }}
          persist-credentials: false

      - name: Install validated controller dependencies
        if: ${{ !inputs.agent_invocation || steps.invocation.outputs.accepted == 'true' }}
        run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: .

      - name: Mask organization issue-field binding components
        if: ${{ !inputs.agent_invocation || steps.invocation.outputs.accepted == 'true' }}
        env:
          ISSUE_FIELD_BINDINGS_JSON: ${{ secrets.ISSUE_FIELD_BINDINGS_JSON }}
        run: node scripts/mask-issue-field-bindings.mjs
        working-directory: trusted-intake

      - name: Set up pinned Codex CLI
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.force }}
        run: node scripts/setup-runner-codex.mjs

      - name: Reason about and validate issue routing
        id: intake
        if: ${{ !inputs.agent_invocation || steps.invocation.outputs.accepted == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_DELIVERY_APP_ID: ${{ vars.CODEX_DELIVERY_APP_ID }}
          CODEX_DELIVERY_APP_PRIVATE_KEY: ${{ secrets.CODEX_DELIVERY_APP_PRIVATE_KEY }}
          CODEX_DELIVERY_APP_INSTALLATION_ID: ${{ vars.CODEX_DELIVERY_APP_INSTALLATION_ID }}
          GITHUB_GRAPHQL: 'true'
          ISSUE_FIELD_BINDINGS_JSON: ${{ secrets.ISSUE_FIELD_BINDINGS_JSON }}
          CODEX_DELIVERY_STATE_DIR: ${{ vars.CODEX_DELIVERY_STATE_DIR }}
          CODEX_MCP_SERVERS: ${{ vars.CODEX_MCP_SERVERS }}
          SOURCE_ISSUE: ${{ steps.invocation.outputs.source_issue || inputs.issue || github.event.inputs.issue || github.event.issue.number }}
          FORCE_ROUTE: ${{ inputs.force || false }}
          INVOCATION_EVENT: ${{ inputs.agent_invocation && 'true' || 'false' }}
          INVOCATION_ACTOR_KIND: ${{ steps.invocation.outputs.invocation_actor_kind }}
          INVOCATION_AUTHORIZED: ${{ steps.invocation.outputs.invocation_authorized }}
          GITHUB_EVENT_NAME: ${{ inputs.agent_invocation && (steps.invocation.outputs.invocation_event_name == 'issues' && 'issues' || 'issue_comment') || github.event_name }}
          GITHUB_EVENT_PATH: ${{ steps.invocation.outputs.event_path || github.event_path }}
          GITHUB_TRIGGERING_ACTOR: ${{ steps.invocation.outputs.invocation_actor || github.triggering_actor || github.actor }}
          ORIGIN_REPOSITORY: ${{ steps.invocation.outputs.origin_repository || github.repository }}
          ORIGIN_REPOSITORY_ID: ${{ steps.invocation.outputs.origin_repository_id || github.event.repository.id }}
          PARTICIPANT_MODE: ${{ steps.intake-policy.outputs.participant_mode }}
          READ_ONLY_RUN: ${{ steps.intake-policy.outputs.read_only_run }}
          FORCE_READ_ONLY: ${{ inputs.force_read_only || false }}
          CONTROL_PLANE_COMMIT: ${{ steps.invocation.outputs.controller_commit || steps.participant.outputs.controller_commit }}
        run: node scripts/issue-intake.mjs

  deliver:
    needs: classify
    if: >-
      needs.classify.result == 'success' &&
      needs.classify.outputs.invocation_accepted != 'false' &&
      (needs.classify.outputs.route == 'plan' ||
       needs.classify.outputs.route == 'implement' ||
       needs.classify.outputs.route == 'resume' ||
       needs.classify.outputs.route == 'refine' ||
       needs.classify.outputs.route == 'research' ||
       needs.classify.outputs.route == 'requirements' ||
       needs.classify.outputs.route == 'architecture' ||
       needs.classify.outputs.route == 'validate' ||
       needs.classify.outputs.route == 'coordinate') &&
      needs.classify.outputs.participant_mode == 'active' &&
      needs.classify.outputs.read_only_run == 'false'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/codex-delivery.yml
    with:
      issue: ${{ needs.classify.outputs.issue }}
      route: ${{ needs.classify.outputs.route }}
      origin_repository: ${{ needs.classify.outputs.origin_repository }}
      origin_repository_id: ${{ needs.classify.outputs.origin_repository_id }}
      invocation_event_name: ${{ needs.classify.outputs.invocation_event_name }}
      invocation_source_kind: ${{ needs.classify.outputs.invocation_source_kind }}
      invocation_comment_id: ${{ needs.classify.outputs.invocation_comment_id }}
      invocation_review_id: ${{ needs.classify.outputs.invocation_review_id }}
      invocation_pull_request_number: ${{ needs.classify.outputs.invocation_pull_request_number }}
      invocation_delivery_id: ${{ needs.classify.outputs.invocation_delivery_id }}
      invocation_actor: ${{ needs.classify.outputs.invocation_actor }}
      invocation_actor_kind: ${{ needs.classify.outputs.invocation_actor_kind }}
      invocation_authorized: ${{ needs.classify.outputs.invocation_authorized }}
      invocation_body_digest: ${{ needs.classify.outputs.invocation_body_digest }}
    secrets:
      CODEX_DELIVERY_APP_PRIVATE_KEY: ${{ secrets.CODEX_DELIVERY_APP_PRIVATE_KEY }}
      ISSUE_FIELD_BINDINGS_JSON: ${{ secrets.ISSUE_FIELD_BINDINGS_JSON }}
