name: issue-intake

on:
  issues:
    types: [opened, edited, reopened, typed, untyped, closed]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: Open source issue number to classify or recover
        required: true
        type: string
      force:
        description: Break glass by using current approved labels when semantic routing is unavailable
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

jobs:
  classify:
    if: >-
      !github.event.issue.pull_request &&
      (github.event_name != 'issue_comment' ||
       (github.event.comment.user.type != 'Bot'))
    runs-on: [self-hosted, linux, x64, omarchy]
    timeout-minutes: 10
    outputs:
      issue: ${{ steps.intake.outputs.issue }}
      route: ${{ steps.intake.outputs.route }}
      state: ${{ steps.intake.outputs.state }}
    steps:
      - name: Check out trusted intake
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          runtime: node@24
          install: false

      - name: Install intake dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Set up pinned Codex CLI
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.force }}
        run: node scripts/setup-runner-codex.mjs

      - name: Reason about and validate issue routing
        id: intake
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ISSUE: ${{ inputs.issue || github.event.inputs.issue || github.event.issue.number }}
          FORCE_ROUTE: ${{ inputs.force || false }}
        run: node scripts/issue-intake.mjs

  deliver:
    needs: classify
    if: needs.classify.result == 'success' && (needs.classify.outputs.route == 'plan' || needs.classify.outputs.route == 'resume' || needs.classify.outputs.route == 'refine' || needs.classify.outputs.route == 'coordinate')
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/codex-delivery.yml
    with:
      issue: ${{ needs.classify.outputs.issue }}
      route: ${{ needs.classify.outputs.route }}
    secrets:
      CODEX_DELIVERY_APP_ID: ${{ secrets.CODEX_DELIVERY_APP_ID }}
      CODEX_DELIVERY_APP_PRIVATE_KEY: ${{ secrets.CODEX_DELIVERY_APP_PRIVATE_KEY }}
      CODEX_DELIVERY_APP_INSTALLATION_ID: ${{ secrets.CODEX_DELIVERY_APP_INSTALLATION_ID }}
