name: harness-architecture-review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Open pull request to review after runner preflight succeeds
        required: true
        type: number

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

concurrency:
  group: harness-architecture-review-${{ github.event.pull_request.number || inputs.pull_request_number }}
  cancel-in-progress: true

jobs:
  review:
    # This repository already limits checked-in code on the dedicated runner
    # to internal pull requests. Forks remain outside this trust boundary.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, omarchy]
    timeout-minutes: 30
    env:
      CODEX_AUTH_HOME: /var/lib/github-runner/.codex
      GH_TOKEN: ${{ github.token }}
      CODEX_DELIVERY_STATE_DIR: ${{ vars.CODEX_DELIVERY_STATE_DIR }}
    steps:
      - name: Check out the review candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the dispatched pull request
        id: target
        if: github.event_name == 'workflow_dispatch'
        env:
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: node scripts/resolve-pull-request-context.mjs

      - name: Resolve the immutable Architecture Authority pin
        id: architecture-pin
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFileSync } from 'node:fs';
          const release = JSON.parse(readFileSync('config/controller-release.json', 'utf8'));
          const architecture = release.dependencies?.architecture;
          if (!architecture || !/^[0-9a-f]{40}$/.test(architecture.commit)
            || !/^[0-9a-f]{64}$/.test(architecture.contentSha256)
            || typeof architecture.version !== 'string') {
            throw new Error('controller release has no complete immutable Architecture dependency');
          }
          process.stdout.write(`commit=${architecture.commit}\n`);
          process.stdout.write(`digest=${architecture.contentSha256}\n`);
          process.stdout.write(`version=${architecture.version}\n`);
          NODE

      - name: Check out the pinned Architecture Authority
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: agentic-delivery-lab/agentic-delivery-architecture
          ref: ${{ steps.architecture-pin.outputs.commit }}
          path: architecture-authority
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Validate toolchain and install trusted dependencies
        run: |
          node scripts/validate-toolchain.mjs
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Set up pinned Codex CLI
        run: node scripts/setup-runner-codex.mjs

      - name: Check Codex model, account, Plan mode, and quota without a model turn
        run: node scripts/codex-preflight.mjs

      - name: Check actual sandbox isolation without a model turn
        run: node scripts/codex-sandbox-check.mjs

      - name: Run deterministic and semantic architecture review
        run: >-
          node scripts/harness-architecture-review.mjs
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --event "$EVENT_PATH"
          --architecture-root architecture-authority
          --architecture-commit "${{ steps.architecture-pin.outputs.commit }}"
          --architecture-digest "${{ steps.architecture-pin.outputs.digest }}"
          --architecture-version "${{ steps.architecture-pin.outputs.version }}"
          --output "$RUNNER_TEMP/harness-architecture-review.json"
          --summary "$GITHUB_STEP_SUMMARY"
          --semantic
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || steps.target.outputs.base_sha }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          EVENT_PATH: ${{ github.event_name == 'pull_request' && github.event_path || steps.target.outputs.event_path }}
