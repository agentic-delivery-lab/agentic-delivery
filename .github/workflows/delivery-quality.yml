name: delivery-quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Open pull request whose candidate should be validated
        required: true
        type: number

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  recovery-sql:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: recovery_test
          POSTGRES_USER: recovery_test
          POSTGRES_PASSWORD: disposable-fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          runtime: node@24
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify recovery against disposable PostgreSQL
        env:
          ISSUE_60_RECOVERY_TEST_DATABASE_URL: postgresql://recovery_test:disposable-fixture@localhost:5432/recovery_test
        run: node --test tests/delivery/archive-issue-60-postgres.test.mjs

  quality:
    # Run deterministic validation on an ephemeral hosted runner so it can
    # finish while Harness occupies the single persistent Codex runner.
    # Fork PRs do not execute repository code until their trust boundary is
    # explicitly supported.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the dispatched pull request
        id: target
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: node scripts/resolve-pull-request-context.mjs

      - name: Validate issue-linked branch
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        env:
          BRANCH_NAME: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || steps.target.outputs.head_ref }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/validate-pull-request-branch.mjs

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Validate toolchain and dependency policy
        run: node scripts/validate-toolchain.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check out the pinned Architecture report contract
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: agentic-delivery-lab/agentic-delivery-architecture
          ref: 06e8f6e3daf4e1c5de99dd2342b9e775b9fb13ed
          path: node_modules/architecture-report-contract
          persist-credentials: false

      - name: Exercise offline evaluation routing against the immutable contract
        env:
          EVALUATION_ROUTE_OUTPUT: ${{ runner.temp }}/evaluation-route.json
        run: |
          set -euo pipefail
          node scripts/route-evaluation-findings.mjs \
            --architecture-root "$GITHUB_WORKSPACE/node_modules/architecture-report-contract" \
            --source-issue https://github.com/agentic-delivery-lab/agentic-delivery/issues/103 \
            --report tests/fixtures/evaluation-reports/synthetic-unmeasured-report.yml \
            > "$EVALUATION_ROUTE_OUTPUT"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const result = JSON.parse(readFileSync(process.env.EVALUATION_ROUTE_OUTPUT, "utf8"));
            if (result.mutationsRequested !== false || result.proposals.length !== 0 || result.dispositions[0]?.status !== "no-action") {
              throw new Error("Offline evaluation routing did not remain a no-action disposition.");
            }
          '

      - name: Validate pull-request title
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        env:
          PR_TITLE: ${{ github.event_name == 'pull_request' && github.event.pull_request.title || steps.target.outputs.title }}
        run: node scripts/validate-pull-request-title.mjs

      - name: Validate commit range
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || steps.target.outputs.base_sha }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/validate-commit-range.mjs "$BASE_SHA" "$HEAD_SHA"

      - name: Validate direct pushes to main
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/validate-main-history.mjs "$BASE_SHA" "$HEAD_SHA"

      - name: Run repository tests
        env:
          EVALUATION_ARCHITECTURE_ROOT: ${{ github.workspace }}/node_modules/architecture-report-contract
        run: pnpm test

      - name: Validate changelog structure
        run: node scripts/validate-changelog.mjs "$GITHUB_WORKSPACE"

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@4580e1612f6407034edd6c0e4e316d725920867b # v24.2.0
        with:
          config: .markdownlint-cli2.jsonc
          globs: |
            **/*.md
            !node_modules/**/*.md
            !tests/**/fixtures/**/*.md

      - name: Validate configuration files
        run: node scripts/validate-config-files.mjs "$GITHUB_WORKSPACE"

      - name: Validate controller release and participant pins
        run: node scripts/validate-controller-release.mjs "$GITHUB_WORKSPACE"

      - name: Validate organization GitHub App contract
        run: node scripts/validate-github-app-contract.mjs "$GITHUB_WORKSPACE"

      - name: Validate repository-independent control-plane boundary
        run: node scripts/validate-control-plane-boundary.mjs "$GITHUB_WORKSPACE"

      - name: Validate repository-boundary migration manifest
        run: node scripts/validate-repository-boundaries.mjs "$GITHUB_WORKSPACE"

      - name: Validate GitHub special-surface boundaries
        run: node scripts/validate-special-surfaces.mjs "$GITHUB_WORKSPACE"

      - name: Validate preview automation templates
        run: node scripts/validate-automation-templates.mjs "$GITHUB_WORKSPACE"

      - name: Validate ADR primitive traceability index
        run: node scripts/generate-adr-primitive-index.mjs --check

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

  portability:
    # Repository code runs on hosted runners only for internal pull requests.
    # Fork pull requests stay outside the trust boundary until they have a safe
    # workflow that does not execute checked-in code with repository secrets.
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Validate toolchain and dependency policy
        run: node scripts/validate-toolchain.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check out the pinned Architecture report contract
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: agentic-delivery-lab/agentic-delivery-architecture
          ref: 06e8f6e3daf4e1c5de99dd2342b9e775b9fb13ed
          path: node_modules/architecture-report-contract
          persist-credentials: false

      - name: Run repository tests
        env:
          EVALUATION_ARCHITECTURE_ROOT: ${{ github.workspace }}/node_modules/architecture-report-contract
        run: pnpm test
