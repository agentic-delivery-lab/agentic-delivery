name: delivery-quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  issues: read

jobs:
  quality:
    # This private repository executes checked-in validation on the dedicated
    # runner. Fork PRs do not run repository code on that runner.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, omarchy]
    timeout-minutes: 10
    env:
      BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate issue-linked branch
        if: github.event_name == 'pull_request'
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/validate-branch-name.sh "$BRANCH_NAME"
          issue_number="${BRANCH_NAME#*/issue-}"
          issue_number="${issue_number%%-*}"
          ./scripts/validate-source-issue.sh "$issue_number"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate pull-request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$PR_TITLE" | npx commitlint --config commitlint.config.mjs
          printf '%s\n' "$PR_TITLE" | node scripts/validate-gitmoji.mjs

      - name: Validate commit range
        shell: bash
        run: npm run lint:commits -- "$BASE_SHA" "$HEAD_SHA"

      - name: Validate direct pushes to main
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$BASE_SHA" =~ ^0{40}$ ]]; then
            commit_range="$HEAD_SHA"
          else
            commit_range="$BASE_SHA..$HEAD_SHA"
          fi

          direct_commits=$(git rev-list --first-parent --no-merges "$commit_range")
          if [[ -n "$direct_commits" ]]; then
            echo "main received non-merge first-parent commits:" >&2
            git log --first-parent --no-merges --format='%h %s' "$commit_range" >&2
            exit 1
          fi

      - name: Run repository tests
        run: npm test

      - name: Validate changelog structure
        shell: bash
        run: ./scripts/validate-changelog.rb "$GITHUB_WORKSPACE"

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@4580e1612f6407034edd6c0e4e316d725920867b # v24.2.0
        with:
          config: .markdownlint-cli2.jsonc
          globs: |
            **/*.md
            !node_modules/**/*.md
            !tests/**/fixtures/**/*.md

      - name: Parse YAML configuration
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.parse_file(path) }' \
            .github/ISSUE_TEMPLATE/architecture-decision.yml \
            .github/workflows/adr-quality.yml \
            .github/workflows/delivery-quality.yml \
            .github/workflows/self-hosted-runner-smoke.yml \
            docs/domain/ubiquitous-language.yml \
            .agents/skills/architecture-decision/agents/openai.yaml \
            .agents/skills/delivery-workflow/agents/openai.yaml \
            .agents/skills/plain-language-communication/agents/openai.yaml \
            .agents/skills/ubiquitous-language/agents/openai.yaml

      - name: Parse JSON configuration
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t json_files < <(git ls-files '*.json')
          node -e 'const fs = require("node:fs"); for (const path of process.argv.slice(1)) JSON.parse(fs.readFileSync(path, "utf8"));' "${json_files[@]}"

      - name: Audit dependencies
        run: npm audit --audit-level=high
