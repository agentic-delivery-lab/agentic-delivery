name: adr-accept-on-approval

on:
  workflow_run:
    workflows: [adr-approval-signal]
    types: [completed]

# The privileged step only uses the trusted workflow and scripts from the
# default branch. It does not check out or execute pull-request contents.
permissions:
  actions: read
  contents: write
  pull-requests: read

jobs:
  accept:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request_review'
    runs-on: [self-hosted, linux, x64, omarchy]
    timeout-minutes: 5
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Accept the proposed ADR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: ./scripts/accept-adr-on-approval.sh
