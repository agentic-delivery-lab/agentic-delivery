name: adr-quality

on:
  pull_request:
    branches: [main]
    paths:
      - AGENTS.md
      - .agents/skills/**
      - .github/ISSUE_TEMPLATE/architecture-decision.yml
      - .github/workflows/adr-approval-signal.yml
      - .github/workflows/adr-accept-on-approval.yml
      - .github/workflows/adr-quality.yml
      - .markdownlint-cli2.jsonc
      - docs/decisions/**
      - scripts/accept-adr-on-approval.sh
      - scripts/accept-proposed-adr.sh
      - scripts/validate-adrs.sh
      - tests/adr/**
  push:
    branches: [main]
    paths:
      - AGENTS.md
      - .agents/skills/**
      - .github/ISSUE_TEMPLATE/architecture-decision.yml
      - .github/workflows/adr-approval-signal.yml
      - .github/workflows/adr-accept-on-approval.yml
      - .github/workflows/adr-quality.yml
      - .markdownlint-cli2.jsonc
      - docs/decisions/**
      - scripts/accept-adr-on-approval.sh
      - scripts/accept-proposed-adr.sh
      - scripts/validate-adrs.sh
      - tests/adr/**

permissions:
  contents: read

jobs:
  validate:
    # The repository is private and this job executes checked-in validation
    # code on the dedicated runner. Fork PRs are intentionally excluded from
    # this trust boundary; do not broaden this condition without a hosted-runner
    # fallback.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, omarchy]
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Validate ADR structure
        shell: bash
        run: ./scripts/validate-adrs.sh "$GITHUB_WORKSPACE"

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@4580e1612f6407034edd6c0e4e316d725920867b # v24.2.0
        with:
          config: .markdownlint-cli2.jsonc
          globs: |
            AGENTS.md
            tasks/*.md
            docs/decisions/*.md
            .agents/skills/**/*.md

      - name: Parse YAML configuration
        shell: bash
        run: >-
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.parse_file(path) }'
          .github/ISSUE_TEMPLATE/architecture-decision.yml
          .github/workflows/adr-quality.yml
          .github/workflows/adr-approval-signal.yml
          .github/workflows/adr-accept-on-approval.yml
          .agents/skills/architecture-decision/agents/openai.yaml

      - name: Run ADR validator tests
        shell: bash
        run: ./tests/adr/test_validate_adrs.sh

      - name: Check architecture decision skill intake contract
        shell: bash
        run: ./tests/adr/test_architecture_decision_skill.sh

      - name: Check workflow security contracts
        shell: bash
        run: ./tests/adr/test_acceptance_workflows.sh

      - name: Check repository contracts
        shell: bash
        run: ./tests/adr/test_repository_contract.sh
