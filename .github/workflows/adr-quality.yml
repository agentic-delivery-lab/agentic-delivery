name: adr-quality

on:
  pull_request:
    branches: [main]
    paths:
      - AGENTS.md
      - .agents/skills/**
      - .github/ISSUE_TEMPLATE/architecture-decision.yml
      - .github/workflows/adr-quality.yml
      - .markdownlint-cli2.jsonc
      - docs/decisions/**
      - scripts/validate-adrs.sh
      - tests/adr/**
  push:
    branches: [main]
    paths:
      - AGENTS.md
      - .agents/skills/**
      - .github/ISSUE_TEMPLATE/architecture-decision.yml
      - .github/workflows/adr-quality.yml
      - .markdownlint-cli2.jsonc
      - docs/decisions/**
      - scripts/validate-adrs.sh
      - tests/adr/**

permissions:
  contents: read

jobs:
  validate:
    # This job executes checked-in validation code from PRs, so isolate it from
    # the dedicated self-hosted runner used by the smoke-test workflow.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Validate ADR structure
        shell: bash
        run: ./scripts/validate-adrs.sh "$GITHUB_WORKSPACE"

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@4580e1612f6407034edd6c0e4e316d725920867b # v24.2.0
        with:
          config: .markdownlint-cli2.jsonc
          globs: |
            AGENTS.md
            tasks/*.md
            docs/decisions/*.md
            .agents/skills/**/*.md

      - name: Parse YAML configuration
        shell: bash
        run: >-
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.parse_file(path) }'
          .github/ISSUE_TEMPLATE/architecture-decision.yml
          .github/workflows/adr-quality.yml
          .agents/skills/architecture-decision/agents/openai.yaml

      - name: Run ADR validator tests
        shell: bash
        run: ./tests/adr/test_validate_adrs.sh
