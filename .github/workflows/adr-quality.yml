name: adr-quality

on:
  pull_request:
    branches: [main]
    paths:
      - AGENTS.md
      - .agents/skills/**
      - .github/workflows/adr-quality.yml
      - .markdownlint-cli2.jsonc
      - CHANGELOG.md
      - .node-version
      - commitlint.config.mjs
      - docs/decisions/**
      - docs/architecture/**
      - docs/delivery/**
      - docs/domain/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - scripts/**/*.mjs
      - tests/adr/**
      - tests/communication/**
      - tests/delivery/**
      - tests/domain/**
  push:
    branches: [main]
    paths:
      - AGENTS.md
      - .agents/skills/**
      - .github/workflows/adr-quality.yml
      - .markdownlint-cli2.jsonc
      - CHANGELOG.md
      - .node-version
      - commitlint.config.mjs
      - docs/decisions/**
      - docs/architecture/**
      - docs/delivery/**
      - docs/domain/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - scripts/**/*.mjs
      - tests/adr/**
      - tests/communication/**
      - tests/delivery/**
      - tests/domain/**

permissions:
  contents: read

jobs:
  validate:
    # This private repository runs checked-in validation code on a dedicated
    # runner. Fork PRs stay outside this trust boundary until a hosted-runner
    # fallback is available.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, omarchy]
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          runtime: node@24
          install: false

      - name: Validate toolchain and dependency policy
        run: node scripts/validate-toolchain.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate ADR structure
        run: node scripts/validate-adrs.mjs "$GITHUB_WORKSPACE"

      - name: Validate domain-language structure
        run: node scripts/validate-domain-language.mjs "$GITHUB_WORKSPACE"

      - name: Validate ADR primitive traceability index
        run: node scripts/generate-adr-primitive-index.mjs --check

      - name: Validate configuration files
        run: node scripts/validate-config-files.mjs "$GITHUB_WORKSPACE"

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@4580e1612f6407034edd6c0e4e316d725920867b # v24.2.0
        with:
          config: .markdownlint-cli2.jsonc
          globs: |
            AGENTS.md
            CHANGELOG.md
            tasks/*.md
            .github/*.md
            docs/decisions/*.md
            docs/delivery/*.md
            docs/domain/*.md
            .agents/skills/**/*.md

      - name: Run ADR validator tests
        run: node --test "tests/adr/*.test.mjs"

      - name: Check architecture decision skill intake contract
        run: node --test "tests/adr/architecture-decision-contract.test.mjs"

      - name: Check repository contracts
        run: node --test "tests/adr/repository-contract.test.mjs"

      - name: Check plain-language communication contract
        run: node --test "tests/communication/*.test.mjs"

      - name: Run domain-language validator tests
        run: node --test "tests/domain/*.test.mjs"

      - name: Check domain-language repository contracts
        run: node --test "tests/domain/domain-language-contract.test.mjs"
