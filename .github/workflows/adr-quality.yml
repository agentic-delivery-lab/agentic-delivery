name: adr-quality

on:
  pull_request:
    branches: [main]
    paths:
      - AGENTS.md
      - .agents/skills/**
      - .github/ISSUE_TEMPLATE/architecture-decision.yml
      - .github/pull_request_template.md
      - .github/workflows/adr-quality.yml
      - .markdownlint-cli2.jsonc
      - CHANGELOG.md
      - .node-version
      - commitlint.config.mjs
      - docs/decisions/**
      - docs/delivery/**
      - docs/domain/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - scripts/validate-adrs.sh
      - scripts/validate-changelog.rb
      - scripts/validate-commit-range.sh
      - scripts/validate-domain-language.rb
      - scripts/validate-gitmoji.mjs
      - tests/adr/**
      - tests/communication/**
      - tests/delivery/**
      - tests/domain/**
  push:
    branches: [main]
    paths:
      - AGENTS.md
      - .agents/skills/**
      - .github/ISSUE_TEMPLATE/architecture-decision.yml
      - .github/pull_request_template.md
      - .github/workflows/adr-quality.yml
      - .markdownlint-cli2.jsonc
      - CHANGELOG.md
      - .node-version
      - commitlint.config.mjs
      - docs/decisions/**
      - docs/delivery/**
      - docs/domain/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - scripts/validate-adrs.sh
      - scripts/validate-changelog.rb
      - scripts/validate-commit-range.sh
      - scripts/validate-domain-language.rb
      - scripts/validate-gitmoji.mjs
      - tests/adr/**
      - tests/communication/**
      - tests/delivery/**
      - tests/domain/**

permissions:
  contents: read

jobs:
  validate:
    # This private repository runs checked-in validation code on a dedicated
    # runner. Fork PRs stay outside this trust boundary until a hosted-runner
    # fallback is available.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, omarchy]
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          runtime: node@24
          install: false

      - name: Validate toolchain and dependency policy
        run: node scripts/validate-toolchain.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate ADR structure
        shell: bash
        run: ./scripts/validate-adrs.sh "$GITHUB_WORKSPACE"

      - name: Validate domain-language structure
        shell: bash
        run: ./scripts/validate-domain-language.rb "$GITHUB_WORKSPACE"

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@4580e1612f6407034edd6c0e4e316d725920867b # v24.2.0
        with:
          config: .markdownlint-cli2.jsonc
          globs: |
            AGENTS.md
            CHANGELOG.md
            tasks/*.md
            .github/*.md
            docs/decisions/*.md
            docs/delivery/*.md
            docs/domain/*.md
            .agents/skills/**/*.md

      - name: Parse YAML configuration
        shell: bash
        run: >-
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.parse_file(path) }'
          .github/ISSUE_TEMPLATE/architecture-decision.yml
          .github/workflows/adr-quality.yml
          docs/domain/ubiquitous-language.yml
          .agents/skills/architecture-decision/agents/openai.yaml
          .agents/skills/delivery-workflow/agents/openai.yaml
          .agents/skills/plain-language-communication/agents/openai.yaml
          .agents/skills/ubiquitous-language/agents/openai.yaml

      - name: Run ADR validator tests
        shell: bash
        run: ./tests/adr/test_validate_adrs.sh

      - name: Check architecture decision skill intake contract
        shell: bash
        run: ./tests/adr/test_architecture_decision_skill.sh

      - name: Check repository contracts
        shell: bash
        run: ./tests/adr/test_repository_contract.sh

      - name: Check plain-language communication contract
        shell: bash
        run: ./tests/communication/test_plain_language_skill.sh

      - name: Run domain-language validator tests
        shell: bash
        run: ./tests/domain/test_validate_domain_language.sh

      - name: Check domain-language repository contracts
        shell: bash
        run: ./tests/domain/test_domain_language_contract.sh
