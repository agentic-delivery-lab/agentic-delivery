name: agent-invocation

# agentic-primitive: {"id":"agent-invocation-workflow","kind":"workflow","enforcement":"deterministic","adrs":["ADR-0017","ADR-0018"],"domains":["agentic-delivery-governance","agentic-delivery-control-plane"]}

on:
  repository_dispatch:
    types: [agent_invocation]

concurrency:
  group: agent-invocation-${{ github.event.client_payload.envelope.delivery_id || github.event.client_payload.delivery_id }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  intake:
    uses: ./.github/workflows/issue-intake.yml
    with:
      agent_invocation: true
    secrets:
      CODEX_DELIVERY_APP_PRIVATE_KEY: ${{ secrets.CODEX_DELIVERY_APP_PRIVATE_KEY }}
      CODEX_DELIVERY_DISPATCH_SECRET: ${{ secrets.CODEX_DELIVERY_DISPATCH_SECRET }}
      ISSUE_FIELD_BINDINGS_JSON: ${{ secrets.ISSUE_FIELD_BINDINGS_JSON }}
      AGENTIC_DELIVERY_REPLAY_DATABASE_URL: ${{ secrets.AGENTIC_DELIVERY_REPLAY_DATABASE_URL }}
