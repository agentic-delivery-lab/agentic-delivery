name: codex-delivery

on:
  workflow_call:
    inputs:
      issue:
        description: Open source issue number to plan or implement
        required: true
        type: string
      route:
        description: Authorized intake route
        required: true
        type: string
  workflow_dispatch:
    inputs:
      issue:
        description: Open source issue number to start or resume
        required: true
        type: string

permissions:
  contents: read

jobs:
  deliver:
    if: github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, x64, omarchy]
    timeout-minutes: 55
    env:
      HOME: /var/lib/github-runner
      CODEX_HOME: /var/lib/github-runner/.codex
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out trusted controller
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          runtime: node@24
          install: false

      - name: Set up pinned Codex CLI
        run: node scripts/setup-runner-codex.mjs

      - name: Install trusted controller dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run source issue delivery
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ISSUE: ${{ inputs.issue || github.event.inputs.issue }}
          INTAKE_ROUTE: ${{ inputs.route || 'resume' }}
          CODEX_DELIVERY_STATE_DIR: ${{ vars.CODEX_DELIVERY_STATE_DIR }}
        run: node scripts/codex-delivery.mjs
