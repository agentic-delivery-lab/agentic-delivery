version: 1
domain:
  name: "Delivery"
  purpose: "Coordinate delivery work."
bounded_contexts:
  - id: "delivery-governance"
    name: "Delivery governance"
    definition: "Rules for delivery work."
terms:
  - context: "delivery-governance"
    term: "source issue"
    definition: "The issue that holds the assignment brief."
    avoid:
      - "source ticket"
  - context: "delivery-governance"
    term: "review pull request"
    definition: "The pull request used to review a change."
